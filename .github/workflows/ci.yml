name: CI

# چرا وجود دارد:
#   پروژه صدها تست دارد، ولی تا امروز فقط وقتی اجرا می‌شدند که کسی
#   دستی دستورشان را تایپ کند. یک بار فراموشی یعنی باگ روی سرور.
#   از این‌جا به بعد هر push و هر PR خودش همه را می‌گیرد.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # اگر چند push پشت هم آمد، فقط آخری مهم است
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: تست‌های پایتون
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt
          pip install -r backend/requirements.txt

      - name: کامپایل همه‌ی ماژول‌ها
        run: python -m compileall -q bot backend tools

      - name: تست‌های ربات
        run: |
          python bot/test_bot.py
          python bot/test_flow.py
          python bot/test_admin.py
          python bot/test_xui.py

      - name: تست‌های پنل و ابزارها
        run: |
          python tools/test-admin-api.py
          python tools/test-billing.py
          python tools/test-monitor.py
          python tools/test-firewall.py
          python tools/test-maintenance.py
          python tools/test-serve.py

      - name: تست‌های اتصال
        # اینها باگ‌هایی را می‌گیرند که تست معمولی نمی‌بیند:
        # دکمه‌ی بی‌هندلر، مسیر بی‌صداکننده، جدول ناموجود.
        run: |
          python tools/test-bot-buttons.py
          python tools/test-bot-throughput.py
          python tools/test-seams.py
          python tools/check-api-contract.py

      - name: پیش‌نمایش متن‌ها باید بدون خطا رندر شود
        # اگر هر صفحه‌ی رباتی بشکند، این‌جا traceback می‌دهد
        run: python bot/preview_texts.py > /dev/null

  frontend:
    name: تست‌های فرانت‌اند
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: نصب وابستگی‌ها
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: ساخت پنل
        working-directory: frontend
        run: npm run build

      - name: تست‌های رندر و صفحه‌ی اشتراک
        env:
          NODE_PATH: ${{ github.workspace }}/frontend/node_modules
        run: |
          node tools/test-render.cjs
          node test-panel-runtime.js
          node test-subpage.js

  release-gate:
    name: دروازه‌ی ریلیز
    # فقط روی تگ — مطمئن می‌شود نسخه‌ی تگ با VERSION و CHANGELOG یکی است
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: بررسی هماهنگی نسخه
        run: python tools/release-check.py --tag "${GITHUB_REF_NAME}"
