<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora | مدیریت صفحه اشتراک</title>
    <!-- ایران‌سنس محلی است. فونت مونواسپیس از گوگل می‌آید و در ایران
         معمولاً بالا نمی‌آید، پس رندر را به آن گره نمی‌زنیم: با
         media="print" بارگذاری‌اش غیرمسدودکننده می‌شود و اگر رسید،
         onload فعالش می‌کند. اگر هم نرسید، زنجیره‌ی محلی --mono در
         index.css جایش را می‌گیرد. -->
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
    <!-- پلِ مینی‌اپ تلگرام. فقط روی /app لازم است، ولی همین‌جا بارگذاری
         می‌شود چون یک بیلد و یک index.html داریم. اسکریپت کوچک است و
         بیرون از تلگرام فقط window.Telegram را تعریف نمی‌کند — که
         خودِ مینی‌اپ همان را می‌سنجد و پیام روشن می‌دهد. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
